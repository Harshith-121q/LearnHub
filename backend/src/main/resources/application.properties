# ==============================================================================
# LearnHub Backend Configuration - Phase 2: MySQL & Spring Data JPA
# ==============================================================================

# Server Configuration
server.port=8080

# Application Info
spring.application.name=learnhub-backend

# ------------------------------------------------------------------------------
# MySQL Database Connection (Configured via Environment Variables)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:harshith121q}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ------------------------------------------------------------------------------
# Hibernate & JPA Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
